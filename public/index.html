<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f4ec" />
    <meta
      name="description"
      content="Connect the letters. Find the words. Challenge a friend."
    />
    <title>Wordkind · Word play</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="/" aria-label="Wordkind home"
        ><img src="/assets/icon.svg" width="34" height="34" alt="" /><span
          >wordkind<span class="brand-dot">.</span></span
        ></a
      >
      <div class="header-actions">
        <button
          class="icon-button wallet-nav"
          id="wallet-nav"
          aria-label="Open word wallet"
        >
          <span data-icon="wallet"></span
          ><b id="wallet-count" hidden>0</b></button
        ><button
          class="icon-button"
          id="menu-button"
          aria-label="Open game menu"
          aria-haspopup="dialog"
        >
          <span data-icon="menu"></span>
        </button>
      </div>
    </header>
    <main class="playground">
      <section class="game" aria-label="Word puzzle">
        <div class="game-toolbar">
          <button
            id="difficulty-button"
            class="difficulty-pill"
            aria-label="Change difficulty"
            aria-haspopup="dialog"
          >
            <span id="difficulty-label">Easy</span
            ><span data-icon="chevron"></span>
          </button>
          <h1 id="level-label">Loading…</h1>
          <button
            class="icon-button"
            id="new-puzzle"
            aria-label="Pick a new random puzzle"
            title="New puzzle"
          >
            <span data-icon="refresh"></span>
          </button>
        </div>
        <div id="race-strip" hidden></div>
        <div class="game-status">
          <button
            id="word-list-button"
            class="game-progress"
            aria-label="View words to find"
          >
            <span id="progress-label">0 / 4 words</span
            ><span data-icon="chevron"></span></button
          ><span id="timer-label" hidden></span>
        </div>
        <div
          id="countdown"
          class="countdown"
          hidden
          aria-live="assertive"
        ></div>
        <div class="board-area">
          <div id="board" class="board" aria-label="Puzzle board"></div>
        </div>
        <div id="board-message" class="board-message" aria-live="polite"></div>
        <div id="word-checklist" hidden></div>
        <div class="word-entry">
          <input
            id="word-input"
            aria-label="Type a word or connect wheel letters"
            maxlength="8"
            autocomplete="off"
            spellcheck="false"
            placeholder="Make a word"
          /><button
            class="icon-button"
            id="submit-word"
            aria-label="Submit word"
          >
            <span data-icon="arrow"></span>
          </button>
        </div>
        <div class="wheel-row">
          <button class="tool-button" id="shuffle-button">
            <span data-icon="shuffle"></span><span>Shuffle</span>
          </button>
          <div class="wheel" id="wheel" aria-label="Letter wheel">
            <svg class="connections" viewBox="0 0 260 260" aria-hidden="true">
              <polyline id="wheel-line" points="" /></svg
            ><button
              class="wheel-center"
              id="clear-word"
              aria-label="Clear selected word"
              title="Clear word"
            >
              <span data-icon="close"></span>
            </button>
            <div id="letters"></div>
          </div>
          <button class="tool-button" id="hint-button">
            <span data-icon="bulb"></span><span>Hint</span>
          </button>
        </div>
      </section>
    </main>
    <dialog
      id="settings-dialog"
      class="settings-drawer"
      aria-labelledby="settings-heading"
    >
      <div class="drawer-header">
        <h2 id="settings-heading">Your game</h2>
        <button
          class="icon-button"
          id="close-settings"
          aria-label="Close game menu"
        >
          <span data-icon="close"></span>
        </button>
      </div>
      <nav class="menu-modes" aria-label="Game modes">
        <button class="active" id="solo-nav">Solo</button
        ><button id="race-nav">
          With a friend <span data-icon="arrow"></span>
        </button>
      </nav>
      <section class="settings-section">
        <h3>Difficulty</h3>
        <div
          class="difficulty-options"
          role="group"
          aria-label="Puzzle difficulty"
          id="difficulty-options"
        ></div>
      </section>
      <section class="settings-section">
        <h3>Mode</h3>
        <div class="play-modes" role="group" aria-label="Solo play mode">
          <button data-mode="zen" class="active">Zen<span>Untimed</span></button
          ><button data-mode="sprint">Sprint<span>3 minutes</span></button
          ><button data-mode="daily">Daily<span>Today’s puzzle</span></button>
        </div>
      </section>
      <div class="menu-links">
        <button id="library-button">
          <span data-icon="grid"></span>Puzzle library<span class="menu-count"
            >1,440</span
          ></button
        ><button id="open-wallet">
          <span data-icon="wallet"></span>Word wallet<span
            data-icon="arrow"
          ></span></button
        ><button id="expand-board">
          <span data-icon="expand"></span>Expand board</button
        ><button id="how-button">
          <span data-icon="help"></span>How to play</button
        ><button
          id="sound-button"
          aria-label="Turn sound on"
          aria-pressed="false"
        >
          <span data-icon="sound"></span>Sound<span
            id="sound-state"
            class="menu-count"
            >Off</span
          >
        </button>
      </div>
      <div id="visit-stats" class="visit-stats"></div>
    </dialog>
    <dialog id="dialog">
      <button
        class="dialog-close icon-button"
        id="close-dialog"
        aria-label="Close"
      >
        <span data-icon="close"></span>
      </button>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
